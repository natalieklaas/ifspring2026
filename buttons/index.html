<!DOCTYPE html>
<html>
	<head>
		
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>Buttons &mdash; James Fawcett</title>

		<link href='https://fonts.googleapis.com/css?family=Open+Sans:400,300,300italic,400italic,600,600italic,700,700italic,800,800italic' rel='stylesheet' type='text/css'>
		<link href='https://fonts.googleapis.com/css?family=Montserrat' rel='stylesheet' type='text/css'>
		<link href='https://fonts.googleapis.com/css?family=Ubuntu:700' rel='stylesheet' type='text/css'>
        <link href='https://fonts.googleapis.com/css?family=Philosopher' rel='stylesheet'>
		<link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN" crossorigin="anonymous">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
		
		<style>

			body {
				color: #333;
				font-family: 'Open Sans', sans-serif;
				margin: 0;
				padding: 0;
			}

			main {
				margin: 40px;
			}

			h1 {
			 	font-size: 30px;
			 	margin-bottom: 40px;
			}

			.button_container {
				border: 1px solid #ddd;
				margin: 0 10px 10px 0;
				padding: 20px;
				width: 300px;
				height: 300px;
				float: left;
				overflow: hidden;
				box-sizing: border-box;
				text-align: center;
			}

			a#btn_spotify {
				display: inline-block;
				height: 50px;
				box-sizing: border-box;
				border-radius: 25px;
				margin: auto;
				margin-top: 100px;
				padding: 10px 40px 0 40px;
				background-color: #2ebd59;
				border: 2px solid #2ebd59;
				color: #fff;
				font-size: 20px;
				font-family: 'Montserrat', sans-serif;
				font-weight: bold;
				text-decoration: none;
				transition: all .5s;
			}

			a#btn_spotify:hover {
				background-color: #fff;
				border: 2px solid #000;
				color: #000;
			}

			a#btn_amazon {
				display: block;
				width: 100px;
				height: 100px;
				box-sizing: border-box;
				border-radius: 50px;
				margin: auto;
				margin-top: 75px;
				padding-top: 8px;
				background-color: #232f3e;
				color: #fff;
				text-align: center;
				font-size: 60px;
				transition: all .2s;
			}

			a#btn_amazon:hover {
				background-color: #fc9a18;
			}

			a#btn_twitter {
				display: inline-block;
				height: 40px;
				box-sizing: border-box;
				border-radius: 4px;
				margin: auto;
				margin-top: 105px;
				padding: 10px 30px 0 30px;
				background-color: #56cdf1;
				color: #fff;
				font-size: 18px;
				font-family: 'Arial', sans-serif;
				font-weight: bold;
				text-decoration: none;
			}

			a#btn_twitter:hover {

				/* Permalink - use to edit and share this gradient: https://colorzilla.com/gradient-editor/#2ebfec+0,28a5cb+100 */
				background: rgb(46,191,236); /* Old browsers */
				background: -moz-linear-gradient(-45deg,  rgba(46,191,236,1) 0%, rgba(40,165,203,1) 100%); /* FF3.6-15 */
				background: -webkit-linear-gradient(-45deg,  rgba(46,191,236,1) 0%,rgba(40,165,203,1) 100%); /* Chrome10-25,Safari5.1-6 */
				background: linear-gradient(135deg,  rgba(46,191,236,1) 0%,rgba(40,165,203,1) 100%); /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
				filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#2ebfec', endColorstr='#28a5cb',GradientType=1 ); /* IE6-9 fallback on horizontal gradient */

			}

			a#btn_indiegogo {
				display: inline-block;
				position: relative;
				margin:auto;
				margin-top: 100px;
				padding: 8px 16px;
				background-color: #fff;
				color: #eb1478;
				font-family: 'Ubuntu', sans-serif;
				font-size: 30px;
				font-weight: bold;
				text-transform: uppercase;
				text-decoration: none;
				letter-spacing: -2px;
				transition: all .2s;
			}

			a#btn_indiegogo:before {
				content: "";
				display: block;
				width: 0;
				height: 0;
				z-index: 1;
				position: absolute;
				top: 50%;
				left: 50%;
				background-color: #eb1478;
				transition: all .5s;
			}

			a#btn_indiegogo:hover {
				color: #fff;
			}

			a#btn_indiegogo:hover:before {
				width: 100%;
				height: 100%;
				left: 0;
				top: 0;
			}

			a#btn_indiegogo span {
				position: relative;
				z-index: 10;
			}

            /* tesla */

            @font-face {
                font-family: 'Tesla';
                src: url('path/to/tesla-font.woff2') format('woff2');
            }


            a#btn_tesla {
				display: inline-block;
				height: 50px;
				box-sizing: border-box;
				border-radius: 2px;
				margin: auto;
				margin-top: 100px;
				padding: 10px 40px 0 40px;
				background-color: #000000;
				border: 2px solid #000000;
				color: #ff0000;
				font-size: 20px;
                font-family: 'Tesla', sans-serif;				
                font-weight: bold;
				text-decoration: none;
				transition: all .5s;
			}

			a#btn_tesla:hover {
				background: linear-gradient(to bottom, rgb(169,3,41) 0%,rgb(143,2,34) 10%,rgb(143,2,34) 22%,rgb(0,0,0) 100%);
				border: 2px solid #000000;
				color: #ffffff;
			}

            /* color run */
            a#btn_colorrun {
				display: inline-block;
				height: 50px;
				margin: auto;
				margin-top: 100px;
				padding: 10px 40px 0 40px;
				background-color: #ffffff;
				border: 2px solid #ff00fb;
				color: #000000;
				font-size: 20px;
                font-family: 'Tesla', sans-serif;				
                font-weight: bold;
				text-decoration: none;
				transition: all .5s;
                text-transform: uppercase;
			}

			a#btn_colorrun:hover {
				border: 2px solid #00e5ff;
			}

            a#btn_colorrun:hover .The{
                color: rgb(255, 0, 230);
            }

            a#btn_colorrun:hover .Color{
                color: rgb(255, 230, 0);
            }

            a#btn_colorrun:hover .Run{
                color: rgb(0, 225, 255);
            }
        
            /* the new yorker */
            @keyframes blink {
                50% { opacity: .3; }
            }

            a#btn_newyorker {
				display: inline-block;
				position: relative;
				margin:auto;
				margin-top: 100px;
				padding: 8px 16px;
				background-color: #fff;
				color: #000000;
				font-family: 'Philosopher', sans-serif;
				font-size: 30px;
				font-weight: bold;
				text-transform: uppercase;
				text-decoration: none;
				letter-spacing: 1px;
				transition: all .2s;
                white-space: normal;
                width: auto;
			}

            a#btn_newyorker {
                display: inline-block;
            }

			a#btn_newyorker:hover .label{
                animation:
                blink 0.8s infinite;
            }

        /* insta */
        a#btn_insta {
				display: block;
				width: 100px;
				height: 100px;
				box-sizing: border-box;
				border-radius: 50px;
				margin: auto;
				margin-top: 75px;
				padding-top: 8px;
				background-color: #232f3e;
				color: #fff;
				text-align: center;
				font-size: 60px;
				transition: all .2s;
	    }

                a#btn_insta:hover{
                    background: linear-gradient(to bottom,  rgb(169,3,41) 0%,rgb(255,5,255) 8%,rgb(3,173,170) 48%,rgb(3,173,170) 48%,rgb(255,5,255) 73%,rgb(143,2,34) 100%,rgb(0,0,0) 100%);
                }
                a#btn_insta:hover i{
                    animation: blink 0.8s;
                }

/* apple */

        a#btn_apple {
            position: relative;
            display: inline-block;
				width: 100px;
				height: 100px;
				margin: auto;
				margin-top: 75px;
				padding-top: 8px;
				background-color: #ffffff;
				color: #000000;
				text-align: center;
				font-size: 60px;
				transition: all .2s;
        }

        #btn_apple:hover i::after {
            transform: translate(-50%, -50%) scale(1);
        }
        
        #btn_apple i {
            position: relative;
            display: inline-block;
        }


        #btn_apple i::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgb(255, 255, 255);
            border-radius: 110%;
            top: 50%;
            left: 85%;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.3s ease;
            z-index: 2;
        }

		</style>
	</head>
	<body>
		
		<main>

			<h1>Button Styling &mdash; James Fawcett</h1>
			
			<div class="button_container">
				<a href="http://www.spotify.com" target="_blank" id="btn_spotify">Spotify</a>
			</div>

			<div class="button_container">
				<a href="http://www.amazon.com" target="_blank" id="btn_amazon"><i class="fa fa-amazon"></i></a>
			</div>

			<div class="button_container">
				<a href="http://www.twitter.com" target="_blank" id="btn_twitter">twitter</a>
			</div>

			<div class="button_container">
				<a href="http://www.indiegogo.com" target="_blank" id="btn_indiegogo"><span>indiegogo</span></a>
			</div>

            <div class="button_container">
				<a href="http://www.teslamotors.com/" target="_blank" id="btn_tesla"><span>TESLA</span></a>
			</div>

            <div class="button_container">
				<a href="http://thecolorrun.com/" target="_blank" id="btn_colorrun"><span class="The">The</span> <span class="Color">Color</span> <span class="Run">Run</span></a>
			</div>

            <div class="button_container">
				<a href="http://www.newyorker.com/" target="_blank" id="btn_newyorker"><span class="label">The New <br> Yorker</span></a>
			</div>

            <div class="button_container">
				<a href="https://www.instagram.com/" target="_blank" id="btn_insta"><i class="fa fa-instagram"></i></a>
			</div>

            <div class="button_container">
				<a href="http://www.apple.com/" target="_blank" id="btn_apple"><i class="fa fa-apple"></i></a>
			</div>

		</main>	

	</body>
</html>
